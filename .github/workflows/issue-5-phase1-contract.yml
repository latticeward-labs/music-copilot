name: Issue 5 Phase 1 - Contract and traceability gate

on:
  push:
    branches:
      - feature/5-onboarding-permissions-recovery
    paths:
      - "docs/implementation/ISSUE_5_*"
      - ".github/PULL_REQUEST_TEMPLATE/issue-5-onboarding-permissions-recovery.md"
      - "scripts/validate_issue5_phase1.py"
      - ".github/workflows/issue-5-phase1-contract.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue5-phase1-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate-delivery-contract:
    name: Source, AC traceability and negative fixture validation
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate P01 contract (NOT Android or device testing)
        run: python3 scripts/validate_issue5_phase1.py --root . --self-test
