name: Issue 17 Phase 12 one-time final acceptance and integrity audit
on:
  push:
    branches: [issue-17/phase-12-final-acceptance-audit-20261011]
    paths:
      - docs/design-system/RUN_ISSUE_17_FINAL_ACCEPTANCE_AUDIT.py
      - .github/workflows/issue17-phase12-final-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Parse syntax
        run: python3 -m py_compile docs/design-system/RUN_ISSUE_17_FINAL_ACCEPTANCE_AUDIT.py
      - name: Run real artifact + internal link audit (preserve detailed findings)
        run: |
          set +e
          python3 docs/design-system/RUN_ISSUE_17_FINAL_ACCEPTANCE_AUDIT.py
          AUDIT_RESULT=$?
          echo "audit_exit=$AUDIT_RESULT" >> "$GITHUB_ENV"
          exit 0
      - name: Commit actual evidence generated by source audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design-system/ISSUE_17_FINAL_ACCEPTANCE_AUDIT.md docs/design-system/ISSUE_17_FINAL_ACCEPTANCE_VALIDATION.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(issue-17): record real Phase-12 acceptance, link and integrity results"
            git push
          fi
      - name: Fail if source audit found non-human blockers
        run: |
          if [ "${audit_exit}" != "0" ]; then
            echo "Source audit found actual failures; inspect committed JSON/Markdown." >&2
            exit 1
          fi
