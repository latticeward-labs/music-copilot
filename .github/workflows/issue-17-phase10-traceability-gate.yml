name: Issue 17 Phase 10 traceability and scope gate
on:
  pull_request:
    paths:
      - 'docs/audit/phase-10/**'
      - 'docs/design-system/**'
      - 'docs/high-fidelity/**'
      - 'docs/wireframes/**'
      - 'docs/user-flows/golden-scenarios/**'
      - 'docs/prototype/**'
      - 'docs/handoff/**'
      - 'docs/PRD.md'
      - 'docs/MVP.md'
      - 'docs/SOFTWARE_ARCHITECTURE.md'
      - '.github/workflows/issue-17-phase10-traceability-gate.yml'
  push:
    branches: [main]
    paths:
      - 'docs/audit/phase-10/**'
      - 'docs/design-system/**'
      - 'docs/high-fidelity/**'
      - 'docs/wireframes/**'
      - 'docs/user-flows/golden-scenarios/**'
      - 'docs/prototype/**'
      - 'docs/handoff/**'
      - 'docs/PRD.md'
      - 'docs/MVP.md'
      - 'docs/SOFTWARE_ARCHITECTURE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  traceability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audit full source, all 541 design assets, P0/P1/P2 and five Golden Scenarios
        run: python3 docs/audit/phase-10/RUN_PHASE_10_AUDIT.py
      - name: Verify generated reports are committed and up-to-date
        run: |
          git diff --exit-code --             docs/audit/phase-10/PHASE_10_VALIDATION.json             docs/audit/phase-10/PHASE_10_TRACEABILITY_REGISTER.json             docs/audit/phase-10/PHASE_10_TRACEABILITY_MATRIX.md             docs/audit/phase-10/PHASE_10_VISUAL_ARTIFACT_MATRIX.md             docs/audit/phase-10/PHASE_10_SCOPE_PRIORITY_AUDIT.md
