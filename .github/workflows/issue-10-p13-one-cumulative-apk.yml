name: "Issue 10 P13 - ONE cumulative APK, BUILD ONLY"
# Explicit owner approval for ONE aggregated P00-P12 Issue #10 APK.
# Only the dedicated request file can trigger this workflow by push.
# No JVM tests, connected/instrumentation/Compose tests, emulator, lint,
# style checks, GitHub CI matrix or analytics are performed here.
on:
  push:
    branches:
      - feature/10-ptt-voice-five-control-intents
    paths:
      - ".github/issue10-p13-apk-request.txt"

permissions:
  contents: read

concurrency:
  group: issue10-p13-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble-one-full-apk:
    name: "One Issue #10 P00-P12 cumulative app-debug.apk (NO TESTS)"
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact cumulative Issue #10 source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Gradle wrapper only
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Install Android compile platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build exactly one app APK (no tests or lint)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/issue10-p13
          {
            echo "issue=10"
            echo "phase=P13"
            echo "branch=${{ github.ref_name }}"
            echo "source_sha=${{ github.sha }}"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "source_scope=entire_P00_to_P12"
            echo "gradle_task=:app:assembleDebug"
            echo "jvm_tests=NOT_RUN"
            echo "compose_tests=NOT_RUN"
            echo "android_instrumented_tests=NOT_RUN"
            echo "lint=NOT_RUN"
            echo "device_tests_M01_M60=NOT_RUN"
            echo "five_intent_lab_attempts=NOT_RUN_0_OF_50"
            echo "acceptance_AC01_AC16=NOT_VERIFIED"
          } > app/build/outputs/issue10-p13/BUILD_PROVENANCE.txt
          ./gradlew --no-daemon --console=plain :app:assembleDebug \
            2>&1 | tee app/build/outputs/issue10-p13/assemble-output.log
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          cp "$apk" app/build/outputs/issue10-p13/app-debug.apk
          sha256sum "$apk" | tee app/build/outputs/issue10-p13/app-debug.apk.sha256
          size="$(stat -c '%s' "$apk")"
          printf '%s\n' "$size" > app/build/outputs/issue10-p13/apk-size-bytes.txt
          printf '%s\n' "${{ github.sha }}" > app/build/outputs/issue10-p13/source-commit.txt
          {
            echo "## Issue #10 — one P00-P12 cumulative debug APK"
            echo "Source SHA: \`${{ github.sha }}\`"
            echo "APK bytes: \`$size\`"
            echo "APK SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            echo "Only Gradle \`:app:assembleDebug\` executed. JVM, Android, Compose, Lint, emulator and phone tests remain **NOT_RUN**."
            echo "Owner phone checklist: \`docs/implementation/ISSUE_10_FINAL_PHONE_QA_CHECKLIST_FA.md\`."
            echo "Lab: \`docs/implementation/ISSUE_10_P13_FIVE_BY_TEN_DIRECT_VOICE_LAB_CORPUS.json\` (50 NOT_RUN)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload one real phone-installable APK, SHA and build provenance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: issue10-p13-one-cumulative-debug-apk
          retention-days: 14
          if-no-files-found: error
          path: |
            app/build/outputs/issue10-p13/app-debug.apk
            app/build/outputs/issue10-p13/app-debug.apk.sha256
            app/build/outputs/issue10-p13/apk-size-bytes.txt
            app/build/outputs/issue10-p13/source-commit.txt
            app/build/outputs/issue10-p13/BUILD_PROVENANCE.txt
      - name: Capture compile-only failure log without running tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue10-p13-build-failure-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/outputs/issue10-p13/BUILD_PROVENANCE.txt
            app/build/outputs/issue10-p13/assemble-output.log
