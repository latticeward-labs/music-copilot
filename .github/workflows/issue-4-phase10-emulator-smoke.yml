name: Issue 4 Phase 10 - Android 10 Compose cold-boot smoke

on:
  push:
    branches:
      - feature/4-android-foundation
    paths:
      - "app/**"
      - "gradle/**"
      - "scripts/check_phase10_design_tokens.py"
      - ".github/workflows/issue-4-phase10-emulator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-4-phase10-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android29-bootstrap-smoke:
    name: API 29 clean install, permissionless Compose startup
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM accelerator for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile unsigned debug APK without backend/credentials
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          python3 scripts/check_phase10_design_tokens.py --root . --self-test
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Real Android 10 no-media and no-grant startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-options: "-no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim"
          script: |
            set -euo pipefail
            mkdir -p app/build/outputs/phase10
            adb shell getprop ro.build.version.sdk | tr -d '\r' | grep -Fxq 29
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.latticeward.musiccopilot.debug
            adb shell pm check-permission com.latticeward.musiccopilot.debug android.permission.READ_EXTERNAL_STORAGE > app/build/outputs/phase10/permission_state.txt 2>&1 || true
            adb shell pm check-permission com.latticeward.musiccopilot.debug android.permission.RECORD_AUDIO >> app/build/outputs/phase10/permission_state.txt 2>&1 || true
            adb shell am start -W -n com.latticeward.musiccopilot.debug/com.latticeward.musiccopilot.app.MainActivity | tee app/build/outputs/phase10/launch.txt
            sleep 7
            test -n "$(adb shell pidof com.latticeward.musiccopilot.debug | tr -d '\r')"
            adb shell dumpsys activity activities > app/build/outputs/phase10/activity_state.txt
            grep -q 'com.latticeward.musiccopilot.debug' app/build/outputs/phase10/activity_state.txt
            adb logcat -d -b crash > app/build/outputs/phase10/crash_buffer.txt
            if grep -Fq 'Process: com.latticeward.musiccopilot.debug' app/build/outputs/phase10/crash_buffer.txt; then
              echo 'PHASE10_DEVICE_SMOKE FAIL: app FATAL EXCEPTION on launch' >&2
              exit 1
            fi
            adb exec-out screencap -p > app/build/outputs/phase10/bootstrap_api29.png
            test -s app/build/outputs/phase10/bootstrap_api29.png
            echo 'PHASE10_DEVICE_SMOKE PASS: API29 clean launch, denied/no media state, process alive, no app crash, screenshot captured'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue4-phase10-api29-cold-boot
          path: |
            app/build/outputs/phase10/**
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
