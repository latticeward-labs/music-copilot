name: Issue 17 Phase 10 scope and source audit
on:
  push:
    branches: [issue-17/phase-10-traceability-prototype-audit-20261011]
    paths:
      - .github/workflows/issue-17-phase10-audit.yml
      - docs/audit/phase-10/**
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue17-phase10-audit
  cancel-in-progress: false
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Execute canonical State, source path, scope and priority audit
        run: python3 docs/audit/phase-10/RUN_PHASE_10_AUDIT.py
      - name: Persist validated machine-readable artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/phase-10/PHASE_10_*.json docs/audit/phase-10/PHASE_10_*.md
          if ! git diff --cached --quiet; then
            git commit -m "test(issue-17): record complete Phase 10 traceability and priority source evidence"
            git push
          fi
