name: Issue 17 Phase 8 strict recovery re-audit
on:
  push:
    branches: [issue-17/phase8-strict-recovery-reaudit-20261011]
    paths:
      - .github/workflows/issue-17-phase8-audit-repair.yml
      - docs/prototype/**
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue17-phase8-strict-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check and machine-route JSON
        run: |
          node --check docs/prototype/routes.js
          node --check docs/prototype/validate.cjs
          node --check docs/prototype/browser-smoke.cjs
          node --check docs/prototype/export-routes.cjs
          node docs/prototype/export-routes.cjs
      - name: Fail closed on unrelated-GS shortcuts and missing safe endpoints
        run: node docs/prototype/validate.cjs
      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Click all primary flows and mandatory recoveries
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/music-phase8-server.log 2>&1 &
          sleep 3
          node docs/prototype/browser-smoke.cjs
      - name: Commit verified routes JSON and QA evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prototype/routes.json docs/prototype/PHASE_8_VALIDATION.json docs/prototype/PHASE_8_BROWSER_VALIDATION.json docs/prototype/PHASE_8_BROWSER_REVIEW.png
          if ! git diff --cached --quiet; then
            git commit -m "test(issue-17): finalize scenario-scoped 5-GS and recovery click evidence"
            git push
          fi
