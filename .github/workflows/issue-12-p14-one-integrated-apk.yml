name: "Issue 12 P14 - one integrated phone APK, BUILD ONLY"

# Owner explicitly requested P14 integrated APK on this feature branch.
# The workflow is triggered exclusively by a separate request marker commit.
# NO test, check, lint, emulator, device test, or unrelated workflow execution.
on:
  push:
    branches:
      - feature/12-privacy-safe-telemetry-measurement
    paths:
      - ".github/issue12-p14-apk-request.txt"

permissions:
  contents: read

concurrency:
  group: issue12-p14-one-integrated-apk
  cancel-in-progress: false

jobs:
  assemble-issue12-p14-only:
    name: "Build source-complete Issue #12 APK ONLY; NO QA execution"
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout exact approved marker commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Pinned Gradle wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Install compileSdk 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare build provenance and pinned OFFLINE English voice runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/12-privacy-safe-telemetry-measurement"
          test -s .github/issue12-p14-apk-request.txt
          grep -Fxq 'issue=12' .github/issue12-p14-apk-request.txt
          grep -Fxq 'phase=P14' .github/issue12-p14-apk-request.txt
          mkdir -p app/src/main/assets app/libs app/build/outputs/issue12-p14
          {
            echo "issue=12 phase=P14 source_scope=P01_P13_integrated"
            echo "repo=$GITHUB_REPOSITORY branch=$GITHUB_REF_NAME commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "gradle_task=:app:assembleDebug tests=NOT_RUN lint=NOT_RUN"
            echo "owner_phone_M001_M121=NOT_RUN all_14_AC=NOT_VERIFIED"
            echo "diagnostics_legal_privacy_approvals=NOT_APPROVED production_sink=NOOP"
          } > app/build/outputs/issue12-p14/BUILD_PROVENANCE.txt
          model=sherpa-onnx-moonshine-tiny-en-quantized-2026-02-27
          curl --fail --location --retry 4 --retry-delay 5 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$model.tar.bz2" \
            -o /tmp/issue12-moonshine-model.tar.bz2
          tar -xjf /tmp/issue12-moonshine-model.tar.bz2 -C app/src/main/assets
          for required in encoder_model.ort decoder_model_merged.ort tokens.txt; do
            test -s "app/src/main/assets/$model/$required"
          done
          rm -rf "app/src/main/assets/$model/test_wavs"
          curl --fail --location --retry 4 --retry-delay 5 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx" \
            -o app/src/main/assets/silero_vad.onnx
          test -s app/src/main/assets/silero_vad.onnx
          curl --fail --location --retry 4 --retry-delay 5 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/sherpa-onnx-2.0.0.aar" \
            -o app/libs/sherpa-onnx-2.0.0.aar
          echo "f0f8716982d27cb4ce695e3934018b1342d9d3d6fdb6ef1f1658fe8bad50b4fc  app/libs/sherpa-onnx-2.0.0.aar" \
            | sha256sum -c -
          {
            sha256sum /tmp/issue12-moonshine-model.tar.bz2
            sha256sum "app/src/main/assets/$model/encoder_model.ort"
            sha256sum "app/src/main/assets/$model/decoder_model_merged.ort"
            sha256sum "app/src/main/assets/$model/tokens.txt"
            sha256sum app/src/main/assets/silero_vad.onnx
            sha256sum app/libs/sherpa-onnx-2.0.0.aar
          } > app/build/outputs/issue12-p14/INPUT_SHA256SUMS.txt

      - name: Assemble exactly one cumulative Android debug APK (NO TESTS)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            -Pissue10QaArm64Only=true :app:assembleDebug \
            2>&1 | tee app/build/outputs/issue12-p14/assemble-output.log
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          cp "$apk" app/build/outputs/issue12-p14/music-copilot-issue12-p14-debug-arm64.apk
          sha256sum app/build/outputs/issue12-p14/music-copilot-issue12-p14-debug-arm64.apk \
            > app/build/outputs/issue12-p14/APK_SHA256SUM.txt
          stat -c '%s' "$apk" > app/build/outputs/issue12-p14/APK_SIZE_BYTES.txt
          echo "$GITHUB_SHA" > app/build/outputs/issue12-p14/SOURCE_COMMIT.txt
          {
            echo "### Issue 12 P14 - one integrated BUILD-ONLY debug APK"
            echo "Source SHA: $GITHUB_SHA"
            echo "APK bytes: $(cat app/build/outputs/issue12-p14/APK_SIZE_BYTES.txt)"
            echo "APK SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)"
            echo "Arm64 phone-ready debug, signed with Gradle's debug keystore."
            echo "Unit/Android/Compose/Python tests, lint, emulator and device QA: NOT_RUN"
            echo "All 14 acceptance criteria: NOT_VERIFIED, #80/#82 OPEN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified APK and exact build evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: issue12-p14-integrated-build-only-apk
          retention-days: 14
          if-no-files-found: error
          path: |
            app/build/outputs/issue12-p14/music-copilot-issue12-p14-debug-arm64.apk
            app/build/outputs/issue12-p14/APK_SHA256SUM.txt
            app/build/outputs/issue12-p14/APK_SIZE_BYTES.txt
            app/build/outputs/issue12-p14/SOURCE_COMMIT.txt
            app/build/outputs/issue12-p14/INPUT_SHA256SUMS.txt
            app/build/outputs/issue12-p14/BUILD_PROVENANCE.txt

      - name: Preserve compile-only failure evidence (NO TESTS)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue12-p14-build-failure-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/outputs/issue12-p14/BUILD_PROVENANCE.txt
            app/build/outputs/issue12-p14/INPUT_SHA256SUMS.txt
            app/build/outputs/issue12-p14/assemble-output.log
