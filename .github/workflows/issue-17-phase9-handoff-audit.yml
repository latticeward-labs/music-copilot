name: Issue 17 Phase 9 Compose handoff source audit
on:
  push:
    branches:
      - issue-17/phase-9-compose-engineering-handoff-20261011
    paths:
      - .github/workflows/issue-17-phase9-handoff-audit.yml
      - docs/handoff/**
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issue17-phase9-handoff-evidence
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Execute independent source, asset, state, and token audit
        run: python3 docs/handoff/VALIDATE_PHASE9.py
      - name: Commit independent audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/handoff/PHASE9_VALIDATION.json docs/handoff/PHASE9_VALIDATION.md
          if ! git diff --cached --quiet; then
            git commit -m "test(issue-17): persist 5-doc/126-state/asset SHA handoff validation"
            git push
          fi
