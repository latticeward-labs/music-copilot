name: Issue 10 - Vosk Small English + Silero VAD APK (BUILD ONLY)
on:
  push:
    branches:
      - fix/issue10-vosk-small-en-us-015
    paths:
      - "app/src/main/java/com/latticeward/musiccopilot/voice/**"
      - "app/src/main/java/com/latticeward/musiccopilot/app/di/VoiceBindings.kt"
      - "app/build.gradle.kts"
      - ".github/workflows/issue10-moonshine-vad-apk-only.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    name: Build complete Music Copilot debug APK - no tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Install target Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Bundle exact offline Vosk small en-US 0.15 and Silero VAD
        shell: bash
        run: |
          set -euo pipefail
          model=vosk-model-small-en-us-0.15
          mkdir -p app/src/main/assets app/libs
          curl --fail --location --retry 4 --retry-delay 5 \
            "https://alphacephei.com/vosk/models/$model.zip" \
            -o /tmp/vosk-en-us-015.zip
          unzip -tq /tmp/vosk-en-us-015.zip
          unzip -q /tmp/vosk-en-us-015.zip -d app/src/main/assets
          test -s "app/src/main/assets/$model/am/final.mdl"
          test -s "app/src/main/assets/$model/conf/model.conf"
          # Version tag for Vosk StorageService's local model cache.
          printf "vosk-small-en-us-0.15-v1\n" > "app/src/main/assets/$model/uuid"
          curl --fail --location --retry 4 --retry-delay 5 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx" \
            -o app/src/main/assets/silero_vad.onnx
          test -s app/src/main/assets/silero_vad.onnx
      - name: Fetch pinned Android Sherpa-ONNX runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 5 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/sherpa-onnx-2.0.0.aar" \
            -o app/libs/sherpa-onnx-2.0.0.aar
          echo "f0f8716982d27cb4ce695e3934018b1342d9d3d6fdb6ef1f1658fe8bad50b4fc  app/libs/sherpa-onnx-2.0.0.aar" \
            | sha256sum -c -
      - name: Assemble full application only - zero automatic tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain -Pissue10QaArm64Only=true :app:assembleDebug
      - name: Stage APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Music-Copilot-Issue10-Vosk-Silero-VAD-debug.apk
          sha256sum release/Music-Copilot-Issue10-Vosk-Silero-VAD-debug.apk \
            > release/Music-Copilot-Issue10-Vosk-Silero-VAD-debug.apk.sha256
          stat -c 'APK_BYTES=%s' release/Music-Copilot-Issue10-Vosk-Silero-VAD-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Copilot-Issue10-Vosk-Silero-VAD-APK
          path: release/
          retention-days: 14
          if-no-files-found: error
