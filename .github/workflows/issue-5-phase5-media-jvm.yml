name: Issue 5 Phase 5 - Native media permission JVM, lint and APK

on:
  push:
    branches:
      - feature/5-onboarding-permissions-recovery
    paths:
      - "app/src/main/**"
      - "app/src/test/java/com/latticeward/musiccopilot/foundation/Issue5Phase5*"
      - ".github/workflows/issue-5-phase5-media-jvm.yml"
      - "docs/implementation/ISSUE_5_PHASE5_*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-media-gate-jvm:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Preflight existing source privacy/architecture checks
        run: |
          python3 scripts/validate_issue5_phase1.py --root . --self-test
          python3 scripts/check_architecture_dependencies.py --root . --self-test
          python3 scripts/check_phase9_privacy.py --root . --self-test
          python3 scripts/check_phase10_design_tokens.py --root . --self-test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Full real Kotlin, JVM, Lint, Detekt, Spotless and APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/reports/issue5-phase5
          ./gradlew spotlessCheck detekt :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee app/build/reports/issue5-phase5/gradle.log
          test -s app/build/test-results/testDebugUnitTest/TEST-com.latticeward.musiccopilot.foundation.Issue5Phase5MediaPermissionTest.xml
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "ISSUE5_P05_MEDIA_JVM_LINT_APK_PASS"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue5-p05-media-jvm-lint-apk
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/reports/issue5-phase5/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/app-debug.apk
