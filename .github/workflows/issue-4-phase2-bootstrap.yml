name: Issue 4 Phase 2 - root Android bootstrap

on:
  push:
    branches:
      - feature/4-android-foundation
    paths:
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "gradle.properties"
      - "app/**"
      - "scripts/check_architecture_dependencies.py"
      - "scripts/check_phase9_privacy.py"
      - "scripts/check_phase10_design_tokens.py"
      - "docs/design-system/foundations/TOKENS.json"
      - "docs/handoff/COMPOSE_TOKEN_MAPPING.md"
      - ".github/workflows/issue-4-phase2-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-4-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-root-app:
    name: Compile root Android app (API 36 / JDK 17)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Enforce Issue 16 package topology and dependency direction
        run: |
          python3 scripts/check_architecture_dependencies.py --root . --self-test
      - name: Enforce Phase 9 Privacy and Quality fail-closed baseline
        run: python3 scripts/check_phase9_privacy.py --root . --self-test
      - name: Enforce Issue 17 exact Compose token mapping and single-shell boundaries
        run: python3 scripts/check_phase10_design_tokens.py --root . --self-test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The old 'tools' SDK package was removed; do not request it.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 36 SDK and build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Verify root project and build without credentials
        run: |
          set -euo pipefail
          test -f gradle/wrapper/gradle-wrapper.jar
          test -x ./gradlew
          test -f settings.gradle.kts
          test -d app/src/main
          test "$(grep -c '^include' settings.gradle.kts)" -eq 1
          grep -Fxq 'include(":app")' settings.gradle.kts
          ./gradlew projects :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          test -s app/schemas/com.latticeward.musiccopilot.data.room.MusicCopilotDatabase/1.json
          echo "ROOM_SCHEMA_EXPORT PASS: v1 JSON generated by annotation processor"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue4-phase2-root-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*-unsigned.apk
            app/build/outputs/logs/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/schemas/**
          if-no-files-found: warn
          retention-days: 14

