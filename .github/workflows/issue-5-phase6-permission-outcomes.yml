name: Issue 5 Phase 6 - Three WF-03 recovery states on Android 10 and 13

on:
  push:
    branches:
      - feature/5-onboarding-permissions-recovery
    paths:
      - "app/src/main/**"
      - "scripts/issue5_phase6_emulator_ui.py"
      - "app/src/test/java/com/latticeward/musiccopilot/foundation/Issue5Phase6*"
      - "scripts/issue5_phase6_native_test.sh"
      - ".github/workflows/issue-5-phase6-permission-outcomes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-media-permission:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [29, 33]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build real app
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare AVD disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          if [ -d "${ANDROID_HOME}/ndk" ]; then sudo rm -rf "${ANDROID_HOME}/ndk"; fi
          if [ -d "${ANDROID_HOME}/cmake" ]; then sudo rm -rf "${ANDROID_HOME}/cmake"; fi
          test "$(df -Pk . | awk 'NR == 2 {print $4}')" -ge 10485760
      - name: Fresh startup no prompt, real denial and granted gated scan
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          profile: pixel_3a
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: "-no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim"
          script: |
            bash scripts/issue5_phase6_native_test.sh "${{ matrix.api }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue5-p06-android-api${{ matrix.api }}-native-dialog-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/outputs/issue5-p06-api${{ matrix.api }}/**
            app/build/outputs/apk/debug/app-debug.apk
