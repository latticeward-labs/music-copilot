name: Issue 17 Phase 7 Accessibility Privacy and System Handoff
on:
  push:
    branches:
      - issue-17/phase-7-accessibility-privacy-system-handoff-20261011
    paths:
      - .github/workflows/issue-17-phase7-handoff.yml
      - docs/high-fidelity/phase-7/PHASE_7_GENERATOR.py
      - docs/high-fidelity/phase-7/PHASE_7_VALIDATE.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate 45 accessible app States and 20 system handoffs
        run: python3 docs/high-fidelity/phase-7/PHASE_7_GENERATOR.py
      - name: Independent source/owner/coverage validation
        run: python3 docs/high-fidelity/phase-7/PHASE_7_VALIDATE.py
      - name: Persist passing source-locked evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/high-fidelity/phase-7
          if ! git diff --cached --quiet; then
            git commit -m "feat(issue-17): 45 accessible app contracts and 20 system handoffs"
            git push
          fi
