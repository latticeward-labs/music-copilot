name: Issue 17 Phase 8 clickable prototype audit
on:
  push:
    branches:
      - issue-17/phase-8-clickable-prototype-20261011
    paths:
      - .github/workflows/issue-17-phase8-prototype-build.yml
      - docs/prototype/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Parse JavaScript
        run: |
          node --check docs/prototype/routes.js
          node --check docs/prototype/app.js
          node --check docs/prototype/validate.cjs
          node --check docs/prototype/browser-smoke.cjs
      - name: Verify GS-01..GS-05 routes/assets/native boundaries
        run: node docs/prototype/validate.cjs
      - name: Install Chromium browser-only test dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute browser clicks and visual smoke
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/musico-proto.log 2>&1 &
          sleep 2
          node docs/prototype/browser-smoke.cjs
      - name: Commit validated evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prototype/PHASE_8_VALIDATION.json docs/prototype/PHASE_8_BROWSER_VALIDATION.json docs/prototype/PHASE_8_BROWSER_REVIEW.png
          if ! git diff --cached --quiet; then
            git commit -m "test(issue-17): record interactive Chromium and source-audit results"
            git push
          fi
