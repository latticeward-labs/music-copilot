name: "Issue 17 Phase 5 deterministic state coverage"
on:
  push:
    branches:
      - "issue-17/phase-5-complete-state-coverage-20261011"
    paths:
      - ".github/workflows/issue-17-phase5-render.yml"
      - "docs/high-fidelity/PHASE_5_GENERATOR.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer and raster validator
        run: |
          python3 -m pip install --quiet cairosvg pillow
      - name: Produce and validate 126 exact state dispositions
        run: |
          python3 docs/high-fidelity/PHASE_5_GENERATOR.py
      - name: Save validated screen-state artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/high-fidelity
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "feat(issue-17): produce 45 app Hi-Fi states, 61 variants and 20 system handoffs"
            git push
          fi
