name: "Issue 11 P13 - one cumulative APK, BUILD ONLY"

# P12 only AUTHORS this file. A P13 human-approved request commit must add
# .github/issue11-p13-apk-request.txt on the feature branch to start it.
# This workflow NEVER triggers from ordinary P12 source or document commits.
on:
  push:
    branches:
      - feature/11-play-artist-one-step-ambiguity
    paths:
      - ".github/issue11-p13-apk-request.txt"

permissions:
  contents: read

concurrency:
  group: issue11-p13-one-cumulative-apk
  cancel-in-progress: false

jobs:
  assemble:
    name: "Assemble one source-complete APK only; no tests or lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout exact marker commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Pinned Gradle wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Install compileSdk 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build provenance and materialize bundled OFFLINE English voice runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/11-play-artist-one-step-ambiguity"
          test -s .github/issue11-p13-apk-request.txt
          mkdir -p app/src/main/assets app/libs app/build/outputs/issue11-p13
          {
            echo "issue=11 phase=P13 scope=entire_P00_to_P12"
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "task=:app:assembleDebug tests=NOT_RUN lint=NOT_RUN"
            echo "phone_M01_M48=NOT_RUN specialist_T01_T10=NOT_RUN lab_L01_L06=NOT_RUN"
            echo "issue11_AC01_AC13=NOT_VERIFIED"
          } > app/build/outputs/issue11-p13/BUILD_PROVENANCE.txt
          model=sherpa-onnx-moonshine-tiny-en-quantized-2026-02-27
          curl --fail --location --retry 4 --retry-delay 5 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$model.tar.bz2" \
            -o /tmp/issue11-moonshine-model.tar.bz2
          tar -xjf /tmp/issue11-moonshine-model.tar.bz2 -C app/src/main/assets
          for required in encoder_model.ort decoder_model_merged.ort tokens.txt; do
            test -s "app/src/main/assets/$model/$required"
          done
          rm -rf "app/src/main/assets/$model/test_wavs"
          curl --fail --location --retry 4 --retry-delay 5 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx" \
            -o app/src/main/assets/silero_vad.onnx
          test -s app/src/main/assets/silero_vad.onnx
          curl --fail --location --retry 4 --retry-delay 5 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.0/sherpa-onnx-2.0.0.aar" \
            -o app/libs/sherpa-onnx-2.0.0.aar
          echo "f0f8716982d27cb4ce695e3934018b1342d9d3d6fdb6ef1f1658fe8bad50b4fc  app/libs/sherpa-onnx-2.0.0.aar" \
            | sha256sum -c -
          {
            sha256sum /tmp/issue11-moonshine-model.tar.bz2
            sha256sum "app/src/main/assets/$model/encoder_model.ort"
            sha256sum "app/src/main/assets/$model/decoder_model_merged.ort"
            sha256sum "app/src/main/assets/$model/tokens.txt"
            sha256sum app/src/main/assets/silero_vad.onnx
            sha256sum app/libs/sherpa-onnx-2.0.0.aar
          } > app/build/outputs/issue11-p13/INPUT_SHA256SUMS.txt
      - name: Assemble cumulative debug APK, zero tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            -Pissue10QaArm64Only=true :app:assembleDebug \
            2>&1 | tee app/build/outputs/issue11-p13/assemble-output.log
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          cp "$apk" app/build/outputs/issue11-p13/music-copilot-issue11-p13-debug.apk
          sha256sum app/build/outputs/issue11-p13/music-copilot-issue11-p13-debug.apk \
            > app/build/outputs/issue11-p13/APK_SHA256SUM.txt
          stat -c '%s' "$apk" > app/build/outputs/issue11-p13/APK_SIZE_BYTES.txt
          echo "$GITHUB_SHA" > app/build/outputs/issue11-p13/SOURCE_COMMIT.txt
          {
            echo "Issue 11 P13 one cumulative BUILD-ONLY debug APK"
            echo "Commit: $GITHUB_SHA"
            echo "APK bytes: $(cat app/build/outputs/issue11-p13/APK_SIZE_BYTES.txt)"
            echo "APK SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)"
            echo "JVM/Android/Compose tests, lint and owner phone QA: NOT_RUN"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK and exact evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: issue11-p13-one-cumulative-build-only-apk
          retention-days: 14
          if-no-files-found: error
          path: |
            app/build/outputs/issue11-p13/music-copilot-issue11-p13-debug.apk
            app/build/outputs/issue11-p13/APK_SHA256SUM.txt
            app/build/outputs/issue11-p13/APK_SIZE_BYTES.txt
            app/build/outputs/issue11-p13/SOURCE_COMMIT.txt
            app/build/outputs/issue11-p13/INPUT_SHA256SUMS.txt
            app/build/outputs/issue11-p13/BUILD_PROVENANCE.txt
      - name: Preserve build-only failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue11-p13-build-failure-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            app/build/outputs/issue11-p13/BUILD_PROVENANCE.txt
            app/build/outputs/issue11-p13/INPUT_SHA256SUMS.txt
            app/build/outputs/issue11-p13/assemble-output.log
