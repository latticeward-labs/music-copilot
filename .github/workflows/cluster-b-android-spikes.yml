name: Cluster B Android spike harness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "spikes/android-validation/**"
      - ".github/workflows/cluster-b-android-spikes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-b-android-spikes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spikes/android-validation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build, unit test, and lint
        run: |
          chmod +x ./gradlew
          if ! ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace; then
            if [[ -f app/build/reports/lint-results-debug.txt ]]; then
              sed -n '1,260p' app/build/reports/lint-results-debug.txt
            fi
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-b-spike-build
          path: |
            spikes/android-validation/app/build/outputs/apk/debug/*.apk
            spikes/android-validation/app/build/reports/**
            spikes/android-validation/app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

  aosp-instrumentation:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 31, 34]
    defaults:
      run:
        working-directory: spikes/android-validation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run AOSP instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          working-directory: spikes/android-validation
          script: |
            chmod +x ./gradlew
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-b-spike-instrumentation-api-${{ matrix.api-level }}
          path: |
            spikes/android-validation/app/build/reports/androidTests/**
            spikes/android-validation/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14
