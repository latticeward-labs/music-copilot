name: Cluster B Android spike harness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "spikes/android-validation/**"
      - ".github/workflows/cluster-b-android-spikes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-b-android-spikes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/android-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build, unit test, and lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-b-spike-build
          path: |
            spikes/android-validation/app/build/outputs/apk/debug/*.apk
            spikes/android-validation/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14

  aosp-instrumentation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 31, 34]
    defaults:
      run:
        working-directory: spikes/android-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run AOSP instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: spikes/android-validation
          script: |
            chmod +x ./gradlew
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-b-spike-instrumentation-api-${{ matrix.api-level }}
          path: |
            spikes/android-validation/app/build/reports/androidTests/**
            spikes/android-validation/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14
