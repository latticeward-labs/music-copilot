name: Issue 17 Phase 13 documentary preflight

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "docs/design-system/ISSUE_17_PHASE_13_*"
      - "docs/design-system/ISSUE_17_HUMAN_APPROVAL_TEMPLATE.md"
      - "docs/design-system/VALIDATE_ISSUE_17_PHASE_13_READINESS.py"
      - ".github/workflows/issue-17-phase13-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-gate-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Phase 13 honesty, 14 AC statuses and existing delivery paths
        run: python3 docs/design-system/VALIDATE_ISSUE_17_PHASE_13_READINESS.py
      - name: Rerun Phase 12 artifact, link, image integrity and traceability audit
        run: python3 docs/design-system/RUN_ISSUE_17_FINAL_ACCEPTANCE_AUDIT.py
      - name: Explain preflight limitation
        run: echo "Green checks mean artifact readiness only; AC-12 remains PENDING_HUMAN and PR must NOT be merged or used to close Issue #17."
