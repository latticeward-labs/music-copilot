name: Issue 17 Phase 6 specialist Driving Voice static render
on:
  push:
    branches:
      - issue-17/phase-6-specialist-driving-voice-20261011
    paths:
      - .github/workflows/issue-17-phase6-render.yml
      - docs/high-fidelity/specialist/PHASE_6_RENDER.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install image renderer
        run: python3 -m pip install --quiet pillow
      - name: Build and validate specialist artifacts
        run: python3 docs/high-fidelity/specialist/PHASE_6_RENDER.py
      - name: Commit validated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/high-fidelity/specialist/phase-6
          if ! git diff --cached --quiet; then
            git commit -m "feat(issue-17): render Phase 6 specialist Driving + Voice assets"
            git push
          fi
