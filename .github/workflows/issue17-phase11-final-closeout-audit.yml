name: Issue 17 Phase 11 Final Closeout Reaudit
on:
  push:
    branches:
      - issue-17/phase-11-pass-closeout-evidence-20261011
    paths:
      - .github/workflows/issue17-phase11-final-closeout-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-phase11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Re-execute independent six-role review contract checker
        run: python3 docs/design-system/review/VALIDATE_ISSUE_17_REVIEW.py
      - name: Verify PASS closeout and no human signature fabrication
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('docs/design-system/review/ISSUE_17_FINDINGS_REGISTER.json')
          r=json.loads(p.read_text(encoding='utf8'))
          assert r['status']=='PASS_COMPLETE_MERGED_AI_ASSISTED_SPEC_REVIEW'
          assert (r['summary']['majorOpen'],r['summary']['blockerOpen'],r['summary']['minorOpen'])==(0,0,4)
          assert r['reviewer']['independentHumanReviewers']==0
          assert r['gate']['issue17MayClose'] is False
          assert pathlib.Path('docs/design-system/review/PHASE_11_FINAL_PASS_CLOSEOUT_2026-10-11.md').exists()
          print('PASS - six AI evidence roles; two Majors resolved; four OPEN Minors; no invented human signoff')
          PY
      - name: Record deterministic PASS validator Markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design-system/review/ISSUE_17_REVIEW_VALIDATION.md
          if ! git diff --cached --quiet; then
            git commit -m "test(issue-17): refresh Phase 11 validated PASS report"
            git push
          fi
