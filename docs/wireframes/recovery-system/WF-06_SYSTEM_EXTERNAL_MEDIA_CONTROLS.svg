<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" data-transition-id="WF-06_SYSTEM_EXTERNAL_MEDIA_CONTROLS" data-terminal="MANUAL_PLAYBACK" data-system-states="CB-28,CB-29">
 <title id="title">WF-06_SYSTEM_EXTERNAL_MEDIA_CONTROLS — External media keys and controller handoff</title><desc id="desc">Ownership-separated low-fidelity recovery and system transition diagram.</desc>
