dth="300" height="62" rx="8" class="surface"/><text x="190" y="607" class="label" text-anchor="middle">Driving Voice failure</text><path d="M340 111 C520 111 530 245 700 245" class="arrow"/><path d="M340 181 C520 181 530 245 700 245" class="arrow"/><path d="M340 251 C520 251 530 245 700 245" class="arrow"/><path d="M340 321 C520 321 530 245 700 245" class="arrow"/><path d="M340 391 C520 391 530 475 700 475" class="arrow"/><path d="M340 461 C520 461 530 475 700 475" class="arrow"/><path d="M340 531 C520 531 530 475 700 475" class="arrow"/><path d="M340 601 C520 601 530 475 700 475" class="arrow"/><rect x="700" y="210" width="340" height="62" rx="8" class="dark"/><text x="870" y="247" class="label inverse" text-anchor="middle">MANUAL_PLAYBACK</text><rect x="700" y="440" width="340" height="62" rx="8" class="dark"/><text x="870" y="477" class="label inverse" text-anchor="middle">SAFE_PAUSED</text><text x="870" y="300" class="note" text-anchor="middle">Manual controls reflect service truth</text><text x="870" y="530" class="note" text-anchor="middle">No automatic Resume</text></svg>
