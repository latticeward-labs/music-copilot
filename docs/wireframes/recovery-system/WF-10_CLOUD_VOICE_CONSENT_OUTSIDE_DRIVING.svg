 <rect x="50" y="90" width="250" height="350" rx="8" class="lane"/><text x="175" y="116" class="h2" text-anchor="middle">Settings / Privacy</text><rect x="355" y="90" width="250" height="350" rx="8" class="lane"/><text x="480" y="116" class="h2" text-anchor="middle">Voice provider boundary</text><rect x="660" y="90" width="250" height="350" rx="8" class="lane"/><text x="785" y="116" class="h2" text-anchor="middle">Manual Playback</text>
 <g><rect x="50" y="140" width="250" height="104" rx="8" class="surface"/><text x="66" y="168" class="label" text-anchor="start">TRIGGER / APP</text><text x="66" y="194" class="note" text-anchor="start">An approved network-assisted</text><text x="66" y="214" class="note" text-anchor="start">Voice adapter is selected and</text><text x="66" y="234" class="note" text-anchor="start">complete disclosure exists.</text></g><g><rect x="355" y="250" width="250" height="104" rx="8" class="surface"/><text x="371" y="278" class="label" text-anchor="start">SYSTEM / COORDINATOR</text><text x="371" y="304" class="note" text-anchor="start">App shows purpose, processing</text><text x="371" y="324" class="note" text-anchor="start">destination and retention</text><text x="371" y="344" class="note" text-anchor="start">disclosure outside Driving</text></g><g><rect x="660" y="140" width="250" height="104" rx="8" class="surface"/><text x="676" y="168" class="label" text-anchor="start">SERVICE TRUTH</text><text x="676" y="194" class="note" text-anchor="start">Decline or missing disclosure</text><text x="676" y="214" class="note" text-anchor="start">keeps Voice Manual Only and</text><text x="676" y="234" class="note" text-anchor="start">never affects local playback.</text></g>
