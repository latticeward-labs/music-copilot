<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" data-transition-id="WF-03_SYSTEM_MICROPHONE_PERMISSION_DIALOG" data-terminal="MANUAL_PLAYBACK" data-system-states="SYS-02">
 <title id="title">WF-03_SYSTEM_MICROPHONE_PERMISSION_DIALOG — Android microphone permission dialog</title><desc id="desc">Ownership-separated low-fidelity recovery and system transition diagram.</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4A4A4A"/></marker></defs>
 <style>text{font-family:Inter,Arial,sans-serif;fill:#171717}.title{font-size:24px;font-weight:700}.h2{font-size:18px;font-weight:600}.body{font-size:14px}.label{font-size:14px;font-weight:700}.note{font-size:12px;fill:#4A4A4A}.chip{font-size:11px;font-weight:700;letter-spacing:.3px}.surface{fill:#FFFFFF;stroke:#C7C7C7;stroke-width:2}.system{fill:#F7F7F7;stroke:#4A4A4A;stroke-width:2;stroke-dasharray:8 6}.lane{fill:#EEEEEE}.terminal{fill:#171717;stroke:#171717}.paused{fill:#4A4A4A;stroke:#171717}.inverse{fill:#FFFFFF}.arrow{stroke:#4A4A4A;stroke-width:2;fill:none;marker-end:url(#arrow)}.divider{stroke:#C7C7C7}</style>
 <rect width="960" height="560" fill="#F7F7F7"/><text x="40" y="42" class="title" text-anchor="start">WF-03_SYSTEM_MICROPHONE_PERMISSION_DIALOG</text><text x="40" y="68" class="body" text-anchor="start">Android microphone permission dialog</text><text x="920" y="42" class="chip" text-anchor="end">Android/System-only transition</text>
 <rect x="50" y="90" width="250" height="350" rx="8" class="lane"/><text x="175" y="116" class="h2" text-anchor="middle">Explicit mic action</text><rect x="355" y="90" width="250" height="350" rx="8" class="lane"/><text x="480" y="116" class="h2" text-anchor="middle">Android permission</text><rect x="660" y="90" width="250" height="350" rx="8" class="lane"/><text x="785" y="116" class="h2" text-anchor="middle">Manual Playback</text>
 <g><rect x="50" y="140" width="250" height="104" rx="8" class="surface"/><text x="66" y="168" class="label" text-anchor="start">TRIGGER / APP</text><text x="66" y="194" class="note" text-anchor="start">The user explicitly taps Mic</text><text x="66" y="214" class="note" text-anchor="start">or chooses Voice practice;</text><text x="66" y="234" class="note" text-anchor="start">never on app or Driving Mode</text></g><g><rect x="355" y="250" width="250" height="104" rx="8" class="system"/><text x="371" y="278" class="label" text-anchor="start">SYSTEM / COORDINATOR</text><text x="371" y="304" class="note" text-anchor="start">App launches the Android-owned</text><text x="371" y="324" class="note" text-anchor="start">microphone dialog after</text><text x="371" y="344" class="note" text-anchor="start">purpose text.</text></g><g><rect x="660" y="140" width="250" height="104" rx="8" class="surface"/><text x="676" y="168" class="label" text-anchor="start">SERVICE TRUTH</text><text x="676" y="194" class="note" text-anchor="start">Playback remains service-owned</text><text x="676" y="214" class="note" text-anchor="start">and usable; capture starts</text><text x="676" y="234" class="note" text-anchor="start">only after a fresh Granted</text></g>
 <path d="M300 192 C330 192 325 302 355 302" class="arrow"/><path d="M605 302 C635 302 630 192 660 192" class="arrow"/><path d="M785 244 L785 398" class="arrow"/>
 <rect x="355" y="398" width="555" height="112" rx="8" class="terminal"/><text x="375" y="428" class="chip inverse" text-anchor="start">SAFE TERMINAL</text><text x="375" y="458" class="title inverse" text-anchor="start">MANUAL_PLAYBACK</text><text x="375" y="484" class="note inverse" text-anchor="start">Granted continues capability check. Denied returns to manual</text><text x="375" y="504" class="note inverse" text-anchor="start">controls; permanent denial offers Settings only outside</text>
 <text x="50" y="470" class="chip" text-anchor="start">RETRY POLICY</text><text x="50" y="494" class="note" text-anchor="start">Requestable denial may retry. No</text><text x="50" y="514" class="note" text-anchor="start">automatic dialog loop and no</text><text x="50" y="534" class="note" text-anchor="start">capture during Retry choice.</text>
 </svg>
