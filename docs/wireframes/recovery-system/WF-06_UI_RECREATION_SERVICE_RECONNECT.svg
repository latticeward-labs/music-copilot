<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" data-transition-id="WF-06_UI_RECREATION_SERVICE_RECONNECT" data-terminal="MANUAL_PLAYBACK / SAFE_PAUSED" data-system-states="CB-22,CB-23,CB-25">
 <title id="title">WF-06_UI_RECREATION_SERVICE_RECONNECT — UI recreation and Playback Service reconnect</title><desc id="desc">Ownership-separated low-fidelity recovery and system transition diagram.</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4A4A4A"/></marker></defs>
 <style>text{font-family:Inter,Arial,sans-serif;fill:#171717}.title{font-size:24px;font-weight:700}.h2{font-size:18px;font-weight:600}.body{font-size:14px}.label{font-size:14px;font-weight:700}.note{font-size:12px;fill:#4A4A4A}.chip{font-size:11px;font-weight:700;letter-spacing:.3px}.surface{fill:#FFFFFF;stroke:#C7C7C7;stroke-width:2}.system{fill:#F7F7F7;stroke:#4A4A4A;stroke-width:2;stroke-dasharray:8 6}.lane{fill:#EEEEEE}.terminal{fill:#171717;stroke:#171717}.paused{fill:#4A4A4A;stroke:#171717}.inverse{fill:#FFFFFF}.arrow{stroke:#4A4A4A;stroke-width:2;fill:none;marker-end:url(#arrow)}.divider{stroke:#C7C7C7}</style>
 <rect width="960" height="560" fill="#F7F7F7"/><text x="40" y="42" class="title" text-anchor="start">WF-06_UI_RECREATION_SERVICE_RECONNECT</text><text x="40" y="68" class="body" text-anchor="start">UI recreation and Playback Service reconnect</text><text x="920" y="42" class="chip" text-anchor="end">App recovery transition</text>
 <rect x="50" y="90" width="250" height="350" rx="8" class="lane"/><text x="175" y="116" class="h2" text-anchor="middle">Recreated / returned UI</text><rect x="355" y="90" width="250" height="350" rx="8" class="lane"/><text x="480" y="116" class="h2" text-anchor="middle">Controller reconnect</text><rect x="660" y="90" width="250" height="350" rx="8" class="lane"/><text x="785" y="116" class="h2" text-anchor="middle">Playback Service</text>
 <g><rect x="50" y="140" width="250" height="104" rx="8" class="surface"/><text x="66" y="168" class="label" text-anchor="start">TRIGGER / APP</text><text x="66" y="194" class="note" text-anchor="start">UI recreation, return from</text><text x="66" y="214" class="note" text-anchor="start">background, task/OEM event or</text><text x="66" y="234" class="note" text-anchor="start">controller loss.</text></g><g><rect x="355" y="250" width="250" height="104" rx="8" class="surface"/><text x="371" y="278" class="label" text-anchor="start">SYSTEM / COORDINATOR</text><text x="371" y="304" class="note" text-anchor="start">UI shows bounded Connecting</text><text x="371" y="324" class="note" text-anchor="start">and requests one complete</text><text x="371" y="344" class="note" text-anchor="start">service snapshot; it creates</text></g><g><rect x="660" y="140" width="250" height="104" rx="8" class="surface"/><text x="676" y="168" class="label" text-anchor="start">SERVICE TRUTH</text><text x="676" y="194" class="note" text-anchor="start">Service remains authority for</text><text x="676" y="214" class="note" text-anchor="start">item, queue, state, position</text><text x="676" y="234" class="note" text-anchor="start">and supported actions.</text></g>
 <path d="M300 192 C330 192 325 302 355 302" class="arrow"/><path d="M605 302 C635 302 630 192 660 192" class="arrow"/><path d="M785 244 L785 398" class="arrow"/>
 <rect x="355" y="398" width="555" height="112" rx="8" class="terminal"/><text x="375" y="428" class="chip inverse" text-anchor="start">SAFE TERMINAL</text><text x="375" y="458" class="title inverse" text-anchor="start">MANUAL_PLAYBACK / SAFE_PAUSED</text><text x="375" y="484" class="note inverse" text-anchor="start">Complete snapshot restores truthful Playing/Paused/Completed.</text><text x="375" y="504" class="note inverse" text-anchor="start">Missing lifecycle may use validated P1 Paused Restore only.</text>
 <text x="50" y="470" class="chip" text-anchor="start">RETRY POLICY</text><text x="50" y="494" class="note" text-anchor="start">Repeated reconnect failure exposes</text><text x="50" y="514" class="note" text-anchor="start">Retry/Back; invalid restore routes</text><text x="50" y="534" class="note" text-anchor="start">to Library and never auto-plays.</text>
 </svg>
