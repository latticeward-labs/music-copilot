  <rect width="620" height="930" fill="#F7F7F7"/><text x="40" y="35" class="h2" text-anchor="start">WF-10_SETTINGS_CLEAR_DATA_HISTORY_CONFIRMATION</text><text x="40" y="60" class="note" text-anchor="start">Settings · Clear Data / History Confirmation</text><rect x="40" y="80" width="360" height="800" rx="18" class="device"/><rect x="40" y="80" width="360" height="24" rx="12" class="subtle"/><text x="52" y="97" class="measure" text-anchor="start">SYSTEM STATUS</text><g><rect x="40" y="104" width="360" height="56" class="surface"/><g data-touch-min="48"><rect x="44" y="108" width="48" height="48" class="touch"/><text x="68" y="139" class="mini" text-anchor="middle">Back</text></g><text x="104" y="140" class="h2" text-anchor="start">Settings</text></g><rect x="56" y="210" width="328" height="400" rx="8" class="surface"/><text x="220" y="255" class="h1" text-anchor="middle">Clear selected data?</text><text x="80" y="300" class="body" text-anchor="start">✓ Voice history</text><text x="80" y="334" class="body" text-anchor="start">✓ Diagnostics queue</text><text x="80" y="382" class="label" text-anchor="start">Preserved: local music files</text><text x="80" y="412" class="label" text-anchor="start">Preserved: active playback</text><g data-touch-min="48"><rect x="80" y="470" width="280" height="48" rx="4" class="inverse"/><text x="220" y="500" class="label inverseText" text-anchor="middle">Confirm clear</text></g><g data-touch-min="48"><rect x="80" y="534" width="280" height="48" rx="4" class="surface"/><text x="220" y="564" class="label" text-anchor="middle">Cancel</text></g><g><rect x="40" y="796" width="360" height="64" class="surface"/><g data-touch-min="48"><rect x="40" y="796" width="90" height="64" class="touch"/><text x="85" y="833" class="mini" text-anchor="middle">Home</text></g><g data-touch-min="48"><rect x="130" y="796" width="90" height="64" class="touch"/><text x="175" y="833" class="mini" text-anchor="middle">Search</text></g><g data-touch-min="48"><rect x="