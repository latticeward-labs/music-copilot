<svg xmlns="http://www.w3.org/2000/svg" width="620" height="930" viewBox="0 0 620 930" role="img" aria-labelledby="title desc" data-wf-id="WF-08_VOICE_LISTENING" data-state-ids="CD-03, CC-14" data-priority="P0">
  <title id="title">WF-08_VOICE_LISTENING — Listening</title><desc id="desc">Low-fidelity GitHub-native app-state frame for Voice Overlay Listening.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#171717}.title{font-size:28px;font-weight:700}.h1{font-size:24px;font-weight:600}.h2{font-size:20px;font-weight:600}.body{font-size:16px}.label{font-size:14px;font-weight:600}.note{font-size:13px;fill:#4A4A4A}.mini{font-size:11px;font-weight:600}.measure{font-size:10px;fill:#4A4A4A}.chip{font-size:12px;font-weight:700;letter-spacing:.4px}.device{fill:#F7F7F7;stroke:#171717;stroke-width:2}.surface{fill:#FFFFFF;stroke:#C7C7C7;stroke-width:1.5}.subtle{fill:#EEEEEE}.inverse{fill:#171717;stroke:#171717}.inverseText{fill:#FFFFFF}.touch{fill:none;stroke:#4A4A4A;stroke-width:1;stroke-dasharray:4 3}.selected{fill:#EEEEEE;stroke:#171717;stroke-width:2}.system{fill:#F7F7F7;stroke:#4A4A4A;stroke-width:1.5;stroke-dasharray:7 5}.annotation{fill:#FFFFFF;stroke:#C7C7C7}.divider{stroke:#C7C7C7}</style>
  <rect width="620" height="930" fill="#F7F7F7"/><text x="40" y="35" class="h2" text-anchor="start">WF-08_VOICE_LISTENING</text><text x="40" y="60" class="note" text-anchor="start">Voice Overlay · Listening</text><rect x="40" y="80" width="360" height="800" rx="18" class="device"/><rect x="40" y="80" width="360" height="24" rx="12" class="subtle"/><text x="52" y="97" class="measure" text-anchor="start">SYSTEM STATUS</text><rect x="40" y="104" width="360" height="756" fill="#C7C7C7"/><text x="60" y="145" class="measure" text-anchor="start">DRIVING / PLAYER CONTEXT</text><rect x="58" y="230" width="324" height="480" rx="12" class="surface"/><text x="220" y="300" class="title" text-anchor="middle">Listening</text><text x="220" y="340" class="body" text-anchor="middle">Six-second attempt</text><circle cx="220" cy="430" r="70" class="subtle"/><text x="220" y="440" class="h1" text-anchor="middle">MIC</text><g data-touch-min="48"><rect x="80" y="610" width="280" height="48" rx="4" class="surface"/><text x="220" y="640" class="label" text-anchor="middle">Cancel</text></g><text x="220" y="670" class="note" text-anchor="middle">Manual / Exit remains reachable</text><rect x="40" y="860" width="360" height="20" class="subtle"/><text x="220" y="875" class="measure" text-anchor="middle">SYSTEM NAV</text><g transform="translate(420 84)"><rect width="180" height="816" rx="8" class="annotation"/><text x="16" y="34" class="chip" text-anchor="start">P0</text><text x="16" y="64" class="note" text-anchor="start">CD-03, CC-14</text><line x1="16" y1="82" x2="164" y2="82" class="divider"/><text x="16" y="112" class="mini" text-anchor="start">OWNERSHIP</text><text x="16" y="136" class="note" text-anchor="start">App + Voice</text><text x="16" y="156" class="note" text-anchor="start">Coordinator</text><text x="16" y="206" class="mini" text-anchor="start">PRIMARY</text><text x="16" y="230" class="note" text-anchor="start">Cancel.</text><text x="16" y="340" class="mini" text-anchor="start">RECOVERY</text><text x="16" y="364" class="note" text-anchor="start">Timeout/no-match/provider</text><text x="16" y="384" class="note" text-anchor="start">failure preserves playback and</text><text x="16" y="404" class="note" text-anchor="start">exposes one Retry.</text><text x="16" y="500" class="mini" text-anchor="start">A11Y</text><text x="16" y="524" class="note" text-anchor="start">Listening status → time limit</text><text x="16" y="544" class="note" text-anchor="start">→ Cancel → underlying</text><text x="16" y="564" class="note" text-anchor="start">manual/Exit controls.</text><text x="16" y="690" class="chip" text-anchor="start">48dp minimum</text><text x="16" y="720" class="note" text-anchor="start">State = label + shape</text><text x="16" y="748" class="note" text-anchor="start">Text scales to 200%</text></g></svg>
