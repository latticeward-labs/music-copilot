  <rect width="620" height="930" fill="#F7F7F7"/><text x="40" y="35" class="h2" text-anchor="start">WF-03_PERMISSIONS_DENIED</text><text x="40" y="60" class="note" text-anchor="start">Permissions · Denied — requestable</text><rect x="40" y="80" width="360" height="820" rx="18" class="device"/><rect x="40" y="80" width="360" height="24" rx="12" class="subtle"/><text x="52" y="97" class="measure" text-anchor="start">SYSTEM STATUS</text><g><rect x="40" y="104" width="360" height="56" class="surface"/><g data-touch-min="48"><rect x="44" y="108" width="48" height="48" class="touch"/><text x="68" y="139" class="mini" text-anchor="middle">Back</text></g><text x="104" y="140" class="h2" text-anchor="start">Permissions</text></g><text x="220" y="235" class="chip" text-anchor="middle">PERMISSION</text><rect x="150" y="270" width="140" height="140" rx="70" class="subtle"/><text x="220" y="350" class="title" text-anchor="middle">!</text><text x="220" y="465" class="h1" text-anchor="middle">Access denied</text><text x="220" y="505" class="body" text-anchor="middle">Manual controls remain available.</text><g data-touch-min="48"><rect x="80" y="570" width="280" height="48" rx="4" class="inverse"/><text x="220" y="600" class="label inverseText" text-anchor="middle">Try again</text></g><g data-touch-min="48"><rect x="80" y="634" width="280" height="48" rx="4" class="surface"/><text x="220" y="664" class="label" text-anchor="middle">Not now</text></g><rect x="40" y="880" width="360" height="20" class="subtle"/><text x="220" y="895" class="measure" text-anchor="middle">SYSTEM NAV</text><g transform="translate(420 84)"><rect width="180" height="816" rx="8" class="annotation"/><text x="16" y="34" class="chip" text-anchor="start">P0</text><text x="16" y="64" class="note" text-anchor="start">S-03, CA-02</text><line x1="16" y1="82" x2="164" y2="82" class="divider"/><text x="16" y="112" class="mini" text-anchor="start">OWNERSHIP</text><text x="16" y="136" class="note" text-anchor="start">Hybrid</text><text x="16" y="206" class="mini" text-anchor="start">PRIMARY</text><text x="16" y="230" class="note" text-anchor="start">Try again; Not now remains</text><text x="16" y="250" class="note" text-anchor="start">equally reachable.</text><text x="16" y="340" class="mini" text-anchor="start">RECOVERY</text><text x="16" y="364" class="note" text-anchor="start">Retry or manual fallback;</text><text x="16" y="384" class="note" text-anchor="start">local browse/playback remains</text><text x="16" y="404" class="note" text-anchor="start">available when mic is denied.</text><text x="16" y="500" class="mini" text-anchor="start">A11Y</text><text x="16" y="524" class="note" text-anchor="start">Denied heading → consequence →</text><text x="16" y="544" class="note" text-anchor="start">Try again → Not now.</text><text x="16" y="690" class="chip" text-anchor="start">48dp minimum</text><text x="16" y="720" class="note" text-anchor="start">State = label + shape</text><text x="16" y="748" class="note" text-anchor="start">Text scales to 200%</text></g></svg>
